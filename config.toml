# N1 POWER bot - settings. Edit on GitHub with the pencil icon. Times are CET/CEST.
# Area codes: AL AT BA BE BG CH CZ DE ES FR GR HR HU IT (=PUN) IT_NORD IT_CNOR IT_CSUD IT_SUD
#             IT_CALA IT_SICI IT_SARD MD ME MK NL PL PT RO RS SI SK TR UA XK

[schedule]
cbc_start = "09:30"              # start checking tomorrow's daily capacity auctions (first results ~09:35)
cbc_final = "17:00"              # keep updating until then; borders still missing are shown as n/a
prices_final = "17:00"           # keep updating until then; markets still missing are shown as n/a
check_every_seconds = 30         # how often missing data is checked while something is due
check_early_minutes = 5          # start checking each market this many minutes before its usual time
run_minutes = 48                 # each GitHub run watches this long; a new run starts every 20 minutes

[prices]
# Hourly price table, in this order
markets = ["IT", "IT_CSUD", "IT_NORD", "IT_SUD", "HU", "SI", "HR", "RS", "RO", "BG", "GR",
           "CZ", "SK", "PL", "ME", "MK", "AL", "AT", "DE", "BE", "NL", "CH", "FR", "ES", "UA"]
peak = "08:00-20:00"             # = hours 9-20
sources = ["volue", "entsoe"]    # Volue first, ENTSO-E for what Volue does not have
# volue_curves = { UA = "pri ua spot €/mwh cet h a" }   # only if a Volue curve has another name

[prices.publish]
# Usual publication time of each day-ahead market (CET). The bot checks every 30 s from 5 min before,
# and sleeps when nothing is due (e.g. ME, MK, RS in -> nothing until Core at 12:55).
ME = "10:30"      # MEPX
MK = "10:45"      # MEMO
CH = "11:10"      # EPEX Swiss
RS = "11:10"      # SEEPEX
default = "12:55" # Core / SDAC and all other markets (incl. AL, IT PUN, UA) - add a line to give a market its own time

[calendar]
# One calendar per country with the full daily base price, running month average and Mon-Sun week average
countries = ["HU", "HR", "SI", "RS", "RO", "BG", "GR", "ME", "MK", "IT", "DE", "AT", "FR", "ES"]
split_after = "MK"                     # calendar picture 1 = HU ... MK, picture 2 = IT ... ES + spread recap
spread_base = "HU"
# Spread to HU: shown small in each country's week column and in the week recap table
spreads = ["HR", "SI", "RS", "RO", "BG", "GR", "ME", "MK", "IT", "DE", "AT"]
country_first = ["DE", "GR", "AT"]     # DEHU = DE - HU ... ; all others HUxx = HU - xx

[cbc]
# Daily explicit capacity auctions, direction FROM>TO
see = ["HU>RS", "RS>HU", "RO>RS", "RS>RO", "BG>RS", "RS>BG", "HR>RS", "RS>HR", "MK>RS", "RS>MK",
       "ME>RS", "RS>ME", "BA>RS", "RS>BA", "HR>BA", "BA>HR", "BA>ME", "ME>BA", "ME>AL", "AL>ME",
       "ME>XK", "XK>ME", "MK>XK", "XK>MK", "AL>GR", "GR>AL", "GR>MK", "MK>GR", "BG>MK", "MK>BG",
       "GR>TR", "TR>GR", "ME>IT", "IT>ME"]
ch = ["DE>CH", "CH>DE", "FR>CH", "CH>FR", "IT>CH", "CH>IT", "AT>CH", "CH>AT"]

[telegram]
excel_when_final = true          # send the Excel file once everything is known
